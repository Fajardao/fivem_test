<!DOCTYPE html>
<html>
<head>
    <title>YT Proxy</title>
    <style>body, html { margin: 0; padding: 0; overflow: hidden; background: black; }</style>
</head>
<body>
    <div id="player"></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: '',
                playerVars: {
                    'autoplay': 1, 'controls': 0, 'disablekb': 1,
                    'enablejsapi': 1, 'fs': 0, 'rel': 0,
                    'iv_load_policy': 3, 'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            // Avisa o FiveM que está pronto
            window.parent.postMessage({ type: 'ready' }, '*');
        }

        function onPlayerStateChange(event) {
            // Envia o estado (Tocar/Pausa/Fim) para o FiveM
            window.parent.postMessage({ type: 'state', data: event.data }, '*');
        }

        // Receber comandos do FiveM
        window.addEventListener('message', function(event) {
            var cmd = event.data;
            if (!player || !player.loadVideoById) return;

            if (cmd.action === 'load') {
                player.loadVideoById(cmd.videoId);
                player.setVolume(cmd.volume);
            } else if (cmd.action === 'play') {
                player.playVideo();
            } else if (cmd.action === 'pause') {
                player.pauseVideo();
            } else if (cmd.action === 'volume') {
                player.setVolume(cmd.volume);
            } else if (cmd.action === 'seek') {
                player.seekTo(cmd.time, true);
            }
        });

        // Enviar progresso a cada 500ms
        setInterval(function() {
            if (player && player.getCurrentTime) {
                window.parent.postMessage({
                    type: 'progress',
                    currentTime: player.getCurrentTime(),
                    duration: player.getDuration()
                }, '*');
            }
        }, 500);
    </script>
</body>
</html>
