<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Playlist Extractor</title>
</head>
<body>
    <script>
        // ------------------------------------------------------------------
        // IMPORTANTE:
        // O GitHub Action vai substituir "SUBS_KEY_AQUI" pela tua chave real.
        // Não alteres este texto se estiveres a usar o workflow .yml
        // ------------------------------------------------------------------
        const API_KEY = "SUBS_KEY_AQUI"; 
        
        // Listener: Ouve os pedidos do FiveM
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (data.action === 'extractPlaylist') {
                if (API_KEY === "SUBS_KEY_AQUI") {
                    console.error("Erro: A chave API não foi injetada. Verifica o GitHub Action.");
                    replyError("Erro de Configuração: API Key não substituída.");
                    return;
                }
                fetchPlaylistItems(data.listId);
            }
        });

        // Função que vai ao YouTube buscar a lista
        async function fetchPlaylistItems(playlistId) {
            let videos = [];
            
            // URL da API do YouTube
            const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${API_KEY}`;

            try {
                const response = await fetch(url);
                const result = await response.json();

                // Verifica se o Google devolveu erro
                if (result.error) {
                    console.error("Erro API:", result.error);
                    
                    if (result.error.code === 403) {
                         replyError("Erro 403: Domínio não autorizado ou quota excedida.");
                    } else if (result.error.code === 404) {
                         replyError("Erro 404: Playlist não encontrada (ou é Privada).");
                    } else {
                         replyError("Erro YouTube: " + result.error.message);
                    }
                    return;
                }

                // Processa a lista de vídeos
                if (result.items) {
                    result.items.forEach(item => {
                        const snippet = item.snippet;
                        // Ignora vídeos que já não existem
                        if (snippet.title !== "Private video" && snippet.title !== "Deleted video") {
                            videos.push({
                                title: snippet.title,
                                videoId: snippet.resourceId.videoId,
                                url: `https://www.youtube.com/watch?v=${snippet.resourceId.videoId}`
                            });
                        }
                    });
                    
                    // Sucesso: Devolve a lista ao FiveM
                    replySuccess(videos);
                } else {
                    replyError("A playlist parece estar vazia.");
                }

            } catch (error) {
                console.error(error);
                replyError("Erro de conexão ao YouTube.");
            }
        }

        // Envia sucesso para o pai (FiveM)
        function replySuccess(videoList) {
            window.parent.postMessage({
                type: 'playlistResults',
                success: true,
                videos: videoList
            }, '*');
        }

        // Envia erro para o pai (FiveM)
        function replyError(msg) {
            window.parent.postMessage({
                type: 'playlistResults',
                success: false,
                message: msg
            }, '*');
        }
    </script>
</body>
</html>
